# Publishes the package when the pull request of a branch release/vX.Y.Z merges.
# The branch name says what is released, and package.json is what proves it.
# The gate and the pack run before the tag. The tag, the publish and the GitHub
# release each do nothing when theirs is already there, so a job that failed
# after the tag can be run again.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      # npm trusted publishing exchanges this for a publish credential; no token is stored.
      id-token: write
      # The tag and the GitHub release.
      contents: write
    env:
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The merge commit this event names, not whatever main is by now:
          # one commit is gated, packed, tagged and published.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # CHANGELOG.md merges by union: a pull request that reached main after
      # this branch was cut can leave its line under Unreleased, or bring back
      # the section Prepare release dropped, and no conflict says so. The first
      # parent of the merge commit is main's tip at the merge, and the branch
      # must contain it.
      - name: Refuse a release whose branch did not contain main
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch -q origin "$HEAD_SHA"
          if ! git merge-base --is-ancestor HEAD^ "$HEAD_SHA"; then
            echo "::error::$BRANCH did not contain main when it merged, so the changelog may be wrong and nothing was tagged or published. Revert this merge on main, delete $BRANCH, run Prepare release again and merge its pull request before any other."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read the release from the branch name
        run: |
          VERSION="${BRANCH#release/v}"
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::the branch says v$VERSION and package.json says v$ACTUAL"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run gate

      # Packed once a run: what a run checksums, attaches and publishes is one
      # file.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack" > /dev/null
          TGZ=$(echo "$RUNNER_TEMP"/pack/*.tgz)
          npm sbom --sbom-format cyclonedx --omit dev > "${TGZ%.tgz}.sbom.json"
          (cd "$RUNNER_TEMP/pack" && shasum -a 256 *.tgz *.sbom.json > SHA256SUMS)
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Tag
        run: |
          REFS=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}")
          AT=$(echo "$REFS" | tail -n 1 | cut -f1)
          if [ "$AT" = "$(git rev-parse HEAD)" ]; then
            echo "v$VERSION is already on this commit."
            exit 0
          fi
          if [ -n "$AT" ]; then
            echo "::error::v$VERSION is on $AT, and this release is $(git rev-parse HEAD)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$NAME $VERSION"
          git push origin "v$VERSION"

      # Trusted publishing needs npm 11.5.1 or later. The version is exact, so
      # the npm that publishes is the one this file names.
      - run: npm install -g npm@11.21.0

      # A version the registry already has is skipped, so the job can be run
      # again, and so the first version of all, which is published by hand
      # because a package with no version has no trusted publisher, passes.
      - name: Publish
        run: |
          if [ "$(npm view "$NAME@$VERSION" version 2> /dev/null)" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already on the registry."
            exit 0
          fi
          npm publish "$TGZ" --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The version's own section of the changelog, as it is written.
          awk -v v="## v$VERSION - " \
            'index($0, v) == 1 {f=1; next} /^## / && f {exit} f {print}' \
            CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || echo "$NAME $VERSION" > notes.md
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The release v$VERSION already exists."
            exit 0
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md \
            "$TGZ" "${TGZ%.tgz}.sbom.json" "$RUNNER_TEMP/pack/SHA256SUMS"
