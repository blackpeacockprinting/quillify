# Opens a release's pull request: the version in package.json and the lockfile,
# and the release's heading over the changelog's Unreleased entries. Merging
# that pull request is what tags and publishes (release.yml).
#
# It needs Settings > Actions > "Allow GitHub Actions to create and approve
# pull requests". A pull request opened with GITHUB_TOKEN starts no workflow,
# so the gate is dispatched at the branch.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      # The dispatch of the gate.
      actions: write
    env:
      BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Bump the version
        run: |
          npm version "$BUMP" --no-git-tag-version > /dev/null
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code origin "refs/heads/release/v$VERSION" > /dev/null 2>&1; then
            echo "::error::release/v$VERSION exists: that release is already open"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Unreleased stays at the top for the next cycle. Its entries do not
      # move: the version's heading goes in between. The release before it
      # goes: its notes are on the releases page.
      - name: Head the changelog's entries
        run: |
          awk -v hdr="## v$VERSION - $(date +%Y-%m-%d)" '
            done && /^## v/ { exit }
            /^$/ { blank++; next }
            { for (; blank > 0; blank--) print ""; print }
            !done && $0 == "## Unreleased" { print ""; print hdr; done = 1 }
          ' CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Push the branch and open the pull request
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "The package is version $VERSION"
          git push -u origin "release/v$VERSION"
          {
            echo "**Before**"
            echo
            echo "The changes since the last release sit under the changelog's Unreleased heading."
            echo
            echo "**After**"
            echo
            echo "The package is version $VERSION. Merging this tags \`v$VERSION\` on the merge commit, publishes the package and makes the GitHub release, whose notes are the \`## v$VERSION\` section of \`CHANGELOG.md\` as it is on this branch. Read that section before merging."
          } > body.md
          gh pr create --base main --head "release/v$VERSION" \
            --title "The package is version $VERSION" --body-file body.md
          gh workflow run gate.yml --ref "release/v$VERSION"
